[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resources-project"
version = "0.1.0"
description = "GenAI portfolio project for natural-language-to-SQL data querying"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "flask>=3.0",
    "openai>=1.0.0",
]

[tool.setuptools]
packages = ["resources"]
